name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/test.sh
      - run: bash scripts/build.sh
      - run: hdiutil verify build/OwnMode-Mac-0.3.0-arm64.dmg
      - run: codesign --verify --deep --strict 'build/OwnMode Mac.app'
  ci-success:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
