name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/test.sh
      - run: bash scripts/build.sh
      - run: test "$RELEASE_TAG" = "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'build/OwnMode Mac.app/Contents/Info.plist')"
      - run: hdiutil verify build/OwnMode-Mac-0.3.0-arm64.dmg
      - run: codesign --verify --deep --strict 'build/OwnMode Mac.app'
      - run: mkdir -p dist && cp build/OwnMode-Mac-0.3.0-arm64.{zip,dmg} dist/
      - run: (cd dist && shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS)
      - run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "OwnMode Mac $RELEASE_TAG" --notes-file RELEASE-NOTES.md
